<aside class="sidebar-container" aria-label="Main navigation">
  <div class="sidebar-header">
    <a routerLink="/products" class="sidebar-brand">
      <span class="brand-icon-box">
        <span class="pi pi-box brand-icon" aria-hidden="true"></span>
      </span>
      <span class="brand-text">
        <span class="brand-name">E-Commerce</span>
        <span class="brand-region">Industrial UK Portal</span>
      </span>
    </a>
  </div>

  <nav class="sidebar-menu" aria-label="Catalog">
    <span class="menu-label">Catalog module</span>

    <a
      routerLink="/products"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="menu-item"
      id="sidebar-nav-products"
    >
      <span class="pi pi-table menu-icon" aria-hidden="true"></span>
      <span class="menu-title">Products</span>
    </a>

    <a
      routerLink="/categories"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="menu-item"
      id="sidebar-nav-categories"
    >
      <span class="pi pi-tags menu-icon" aria-hidden="true"></span>
      <span class="menu-title">Categories</span>
    </a>

    @if (authService.hasRole(['admin'])) {
      <span class="menu-label admin-menu-label">Administration</span>
      <a
        routerLink="/admin/users"
        routerLinkActive="active"
        class="menu-item"
        id="sidebar-nav-users"
      >
        <span class="pi pi-users menu-icon" aria-hidden="true"></span>
        <span class="menu-title">Users</span>
      </a>
      <a
        routerLink="/admin/roles"
        routerLinkActive="active"
        class="menu-item"
        id="sidebar-nav-roles"
      >
        <span class="pi pi-shield menu-icon" aria-hidden="true"></span>
        <span class="menu-title">Roles &amp; Permissions</span>
      </a>
    }
  </nav>

  <footer class="sidebar-footer">
  <button type="button" class="sidebar-logout-button" (click)="logout()">
      <span class="pi pi-sign-out" aria-hidden="true"></span>
      <span>Sign out</span>
    </button>
  </footer>
</aside>
